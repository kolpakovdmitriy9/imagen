<title>Промо-баннер конструктор</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap">
<style>
:root{
  --bg:#f4f4f7; --panel:#ffffff; --fg:#17171c; --muted:#6c6c78; --line:#e1e1e8;
  --accent:#3d5afe; --stage:#e6e7ee; --btn:#17171c; --btn-fg:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101014; --panel:#1a1a20; --fg:#f0f0f4; --muted:#9a9aa6; --line:#2c2c35;
    --accent:#8c9dff; --stage:#0b0b0f; --btn:#f0f0f4; --btn-fg:#101014; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101014; --panel:#1a1a20; --fg:#f0f0f4; --muted:#9a9aa6; --line:#2c2c35;
  --accent:#8c9dff; --stage:#0b0b0f; --btn:#f0f0f4; --btn-fg:#101014; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Manrope,system-ui,sans-serif}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{padding-block:24px;padding-inline:16px;max-width:1120px;margin:0 auto}
.head h1{font:800 22px/1.2 Unbounded,system-ui,sans-serif;margin:0 0 6px}
.head p{margin:0 0 20px;color:var(--muted)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.field input[type=text],.field textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
.field textarea{resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.colors{display:flex;gap:14px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.colors input[type=color]{width:38px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:9px;border:0;background:var(--btn);color:var(--btn-fg);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details textarea{width:100%;box-sizing:border-box;margin-top:8px;font:12px/1.4 ui-monospace,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}

.preview{min-width:0;display:flex;flex-direction:column;gap:10px}
.stage{background:var(--stage);border-radius:14px;overflow:hidden;position:relative;display:flex;justify-content:center;align-items:center;padding:24px;min-height:120px}
.stage.popup{height:620px;padding:0;display:block}
.site{position:absolute;inset:0;background:#eef0f4;overflow:hidden}
.site .top{height:52px;background:#fff;border-bottom:1px solid #e0e0e8;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.site .logo{width:90px;height:14px;border-radius:4px;background:#2d2d3a}
.site .nav i{display:inline-block;width:46px;height:8px;border-radius:4px;background:#cfd0da;margin-left:14px}
.site .hero{padding:44px 28px;display:flex;flex-direction:column;gap:14px}
.site .h1{width:46%;height:24px;border-radius:6px;background:#d6d7e0}
.site .h2{width:68%;height:10px;border-radius:5px;background:#dcdde5}
.site .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.site .cards div{height:130px;border-radius:12px;background:#e2e3ea}

.pb-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,20,.55)}
.stage .pb-overlay{position:absolute;inset:0}

.pb-banner{position:relative;width:min(650px,100%);aspect-ratio:13/10;overflow:hidden;container-type:inline-size;border-radius:14px;background:var(--pb-bg);color:var(--pb-fg)}
.pb-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.pb-badge{position:absolute;left:6cqw;top:6cqw;padding:1.2cqw 2.8cqw;border-radius:999px;background:var(--pb-accent);color:var(--pb-accent-fg);font:700 2.3cqw/1 Manrope,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.pb-copy{position:absolute;left:6cqw;bottom:6cqw;width:58cqw;box-sizing:border-box;padding:5cqw 5.2cqw;border-radius:3cqw;background:var(--pb-panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:flex-start;gap:2.4cqw}
.pb-title{margin:0;font:800 7cqw/1.02 Unbounded,system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.pb-sub{margin:0;font:500 3cqw/1.45 Manrope,system-ui,sans-serif;opacity:.92}
.pb-btn{margin-top:.8cqw;padding:2.2cqw 4.4cqw;border:0;border-radius:999px;background:var(--pb-accent);color:var(--pb-accent-fg);font:700 3cqw/1 Manrope,system-ui,sans-serif;cursor:pointer}
.pb-close{position:absolute;top:4cqw;right:4cqw;width:max(30px,7cqw);height:max(30px,7cqw);border:0;border-radius:50%;background:var(--pb-panel);color:var(--pb-fg);font:600 max(18px,4cqw)/1 system-ui,sans-serif;cursor:pointer}
</style>

<div class="wrap">
  <header class="head">
    <h1>Промо-баннер 650 × 500</h1>
    <p>Баннер для акций. Можно показать его как поп-ап поверх любой страницы.</p>
  </header>

  <div class="app">
    <aside class="panel">
      <div class="field">
        <span class="label">Режим</span>
        <div class="seg" data-group="mode">
          <button type="button" data-v="banner">Баннер</button>
          <button type="button" data-v="popup">Поп-ап</button>
        </div>
      </div>

      <div class="field"><label>Метка</label><input type="text" data-k="badge"></div>
      <div class="field"><label>Заголовок</label><input type="text" data-k="title"></div>
      <div class="field"><label>Текст</label><textarea data-k="sub" rows="3"></textarea></div>
      <div class="field"><label>Текст кнопки</label><input type="text" data-k="btn"></div>

      <div class="field">
        <span class="label">Узор</span>
        <div class="seg" data-group="type">
          <button type="button" data-v="dots">Точки</button>
          <button type="button" data-v="stripes">Полосы</button>
          <button type="button" data-v="waves">Волны</button>
          <button type="button" data-v="lines">Линии</button>
          <button type="button" data-v="stars">Звёзды</button>
          <button type="button" data-v="zigzag">Зигзаг</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Фигура</span>
        <div class="seg" data-group="figure">
          <button type="button" data-v="none">Нет</button>
          <button type="button" data-v="circle">Круг</button>
          <button type="button" data-v="arc">Полукруг</button>
          <button type="button" data-v="ring">Кольцо</button>
        </div>
      </div>

      <div class="field"><label>Плотность <output data-out="density"></output></label><input type="range" min="1" max="10" step="1" data-k="density"></div>
      <div class="field"><label>Толщина и размер <output data-out="scale"></output></label><input type="range" min="1" max="10" step="1" data-k="scale"></div>
      <div class="field"><label>Поворот, ° <output data-out="rot"></output></label><input type="range" min="0" max="180" step="1" data-k="rot"></div>
      <div class="field"><label>Прозрачность узора, % <output data-out="opacity"></output></label><input type="range" min="10" max="100" step="1" data-k="opacity"></div>

      <div class="field">
        <span class="label">Цвета</span>
        <div class="colors">
          <label>Фон <input type="color" data-k="bg"></label>
          <label>Узор <input type="color" data-k="pattern"></label>
          <label>Акцент <input type="color" data-k="accent"></label>
        </div>
      </div>

      <div class="row">
        <button type="button" class="btn ghost" data-action="seed">Новый узор</button>
        <span class="muted">№ <output data-out="seed"></output></span>
      </div>

      <div class="row">
        <button type="button" class="btn" data-action="png">Сохранить в PNG</button>
        <span class="muted" id="png-status"></span>
      </div>
      <div id="png-out" hidden>
        <p class="muted" style="margin:0 0 8px">Нажмите на картинку правой кнопкой (или удерживайте её на телефоне) и выберите «Сохранить изображение».</p>
        <img id="png-img" alt="Баннер в PNG" style="width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)">
      </div>
    </aside>

    <section class="preview">
      <div class="stage" id="stage"></div>
      <div class="row">
        <span class="muted">Изменения видны сразу. Размер 650 × 500, масштабируется по ширине.</span>
        <button type="button" class="btn ghost" id="restore" hidden>Показать поп-ап снова</button>
      </div>
    </section>
  </div>
</div>

<script>
const W = 650, H = 500;

const state = {
  mode: 'popup',
  badge: 'Акция',
  title: 'Весенняя распродажа',
  sub: 'Скидки до 50% на всю коллекцию. Успейте до конца недели.',
  btn: 'Смотреть',
  type: 'dots',
  figure: 'circle',
  density: 5,
  scale: 5,
  rot: 20,
  opacity: 85,
  bg: '#1d1a3a',
  pattern: '#ffffff',
  accent: '#ff7a59',
  seed: 2026,
  closed: false
};

const BANNER_CSS = `
.pb-banner{position:relative;width:min(650px,100%);aspect-ratio:13/10;overflow:hidden;container-type:inline-size;border-radius:14px;background:var(--pb-bg);color:var(--pb-fg)}
.pb-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.pb-badge{position:absolute;left:6cqw;top:6cqw;padding:1.2cqw 2.8cqw;border-radius:999px;background:var(--pb-accent);color:var(--pb-accent-fg);font:700 2.3cqw/1 Manrope,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.pb-copy{position:absolute;left:6cqw;bottom:6cqw;width:58cqw;box-sizing:border-box;padding:5cqw 5.2cqw;border-radius:3cqw;background:var(--pb-panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:flex-start;gap:2.4cqw}
.pb-title{margin:0;font:800 7cqw/1.02 Unbounded,system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.pb-sub{margin:0;font:500 3cqw/1.45 Manrope,system-ui,sans-serif;opacity:.92}
.pb-btn{margin-top:.8cqw;padding:2.2cqw 4.4cqw;border:0;border-radius:999px;background:var(--pb-accent);color:var(--pb-accent-fg);font:700 3cqw/1 Manrope,system-ui,sans-serif;cursor:pointer}
.pb-close{position:absolute;top:4cqw;right:4cqw;width:max(30px,7cqw);height:max(30px,7cqw);border:0;border-radius:50%;background:var(--pb-panel);color:var(--pb-fg);font:600 max(18px,4cqw)/1 system-ui,sans-serif;cursor:pointer}
`;
const OVERLAY_CSS = `
.pb-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,20,.55)}
`;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function isLight(hex){
  const n = parseInt(hex.slice(1), 16);
  const L = (0.299*(n>>16&255) + 0.587*(n>>8&255) + 0.114*(n&255)) / 255;
  return L > 0.6;
}
function star(cx, cy, ro, ri, n, rot){
  let d = '';
  for(let i = 0; i < n*2; i++){
    const rad = i % 2 ? ri : ro;
    const a = rot - Math.PI/2 + i*Math.PI/n;
    d += (i ? 'L' : 'M') + (cx + rad*Math.cos(a)).toFixed(1) + ' ' + (cy + rad*Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
function smooth(p){
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for(let i = 0; i < p.length - 1; i++){
    const p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

function buildArt(p){
  const r = mulberry32(p.seed);
  const R = (a, b) => a + (b - a) * r();
  const d = +p.density, s = +p.scale, c = p.pattern, a = p.accent;
  const pick = () => r() < 0.12 ? a : c;
  const pat = [];

  switch(p.type){
    case 'dots': {
      const step = 46 - d*3.6;
      const cx = R(0, W), cy = R(0, H), maxR = step*(0.15 + s*0.035), diag = Math.hypot(W, H)/2;
      for(let y = -step/2; y < H + step; y += step)
        for(let x = -step/2; x < W + step; x += step){
          const k = Math.min(1, Math.hypot(x - cx, (y - cy)*0.85) / diag);
          const rad = maxR * Math.pow(1 - k, 1.3) * (0.55 + 0.45*r());
          if(rad < 0.5) continue;
          pat.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(2)}" fill="${pick()}"/>`);
        }
      break;
    }
    case 'stripes': {
      const sp = 70 - d*5.5, off = R(0, sp);
      for(let x = -H + off; x < W + H; x += sp){
        const w = sp * R(0.12, 0.22 + s*0.05);
        pat.push(`<rect x="${x.toFixed(1)}" y="${-H}" width="${w.toFixed(1)}" height="${H*3}" fill="${pick()}"/>`);
      }
      break;
    }
    case 'waves': {
      const n = 5 + d*2, sp = H/(n-1);
      for(let i = -1; i <= n; i++){
        const y0 = i*sp, amp = R(8, 26)*(s/5 + 0.4), f = R(0.006, 0.014), ph = R(0, 6.28);
        const f2 = f*R(1.8, 2.8), ph2 = R(0, 6.28), w = (1.2 + s*0.55)*R(0.7, 1.3);
        let dd = '';
        for(let x = -20; x <= W + 20; x += 6){
          const y = y0 + amp*Math.sin(x*f + ph) + amp*0.35*Math.sin(x*f2 + ph2);
          dd += (x === -20 ? 'M' : 'L') + x + ' ' + y.toFixed(1) + ' ';
        }
        pat.push(`<path d="${dd}" fill="none" stroke="${pick()}" stroke-width="${w.toFixed(2)}" stroke-linecap="round"/>`);
      }
      break;
    }
    case 'lines': {
      const n = 6 + d*2;
      for(let i = 0; i < n; i++){
        const k = 4 + Math.floor(R(0, 3));
        const pts = [];
        let x = R(-60, W*0.3), y = R(-40, H + 40);
        for(let j = 0; j < k; j++){
          pts.push([x, y]);
          x += R(60, 140)*(0.6 + s*0.08);
          y += R(-120, 120);
        }
        pat.push(`<path d="${smooth(pts)}" fill="none" stroke="${pick()}" stroke-width="${(1 + s*0.4*R(0.4, 1.4)).toFixed(2)}" stroke-linecap="round"/>`);
      }
      break;
    }
    case 'stars': {
      const n = 18 + d*14;
      for(let i = 0; i < n; i++){
        const x = R(0, W), y = R(0, H), big = Math.pow(r(), 3);
        const rr = 3 + s*1.6*(0.4 + big*3.2);
        pat.push(`<path d="${star(x, y, rr, rr*0.45, 5, R(-0.4, 0.4))}" fill="${pick()}"/>`);
      }
      break;
    }
    case 'zigzag': {
      const rows = 6 + d*2, sp = H/(rows-1);
      for(let i = 0; i < rows; i++){
        const y0 = i*sp, amp = (6 + s*2.4)*R(0.6, 1.2), step = 22 - d*1.2;
        let dd = '';
        for(let x = -20, k = 0; x <= W + 20; x += step, k++){
          const y = y0 + (k % 2 ? amp : -amp)*R(0.8, 1.1);
          dd += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
        }
        pat.push(`<path d="${dd}" fill="none" stroke="${pick()}" stroke-width="${(1 + s*0.35).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round"/>`);
      }
      break;
    }
  }

  const op = (p.opacity/100).toFixed(2);
  let svg = `<rect width="${W}" height="${H}" fill="${p.bg}"/>`;
  svg += `<g opacity="${op}" transform="rotate(${p.rot} ${W/2} ${H/2})">${pat.join('')}</g>`;

  if(p.figure !== 'none'){
    const cx = R(430, 600), cy = R(70, 430), rad = R(100, 180);
    if(p.figure === 'circle'){
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="${a}"/>`;
    } else if(p.figure === 'arc'){
      svg += `<path d="M${(cx-rad).toFixed(1)} ${cy.toFixed(1)} A${rad.toFixed(1)} ${rad.toFixed(1)} 0 0 1 ${(cx+rad).toFixed(1)} ${cy.toFixed(1)} Z" fill="${a}" transform="rotate(${R(-50, 50).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`;
    } else if(p.figure === 'ring'){
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="none" stroke="${a}" stroke-width="${(14 + s*2).toFixed(1)}"/>`;
    }
  }
  return svg;
}

function bannerMarkup(p, withClose){
  const fg = isLight(p.bg) ? '#14141a' : '#ffffff';
  const afg = isLight(p.accent) ? '#14141a' : '#ffffff';
  const vars = `--pb-bg:${p.bg};--pb-fg:${fg};--pb-accent:${p.accent};--pb-accent-fg:${afg};--pb-panel:${hexA(p.bg, 0.78)}`;
  return `<div class="pb-banner" style="${vars}">
  <svg class="pb-art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${buildArt(p)}</svg>
  ${p.badge ? `<span class="pb-badge">${esc(p.badge)}</span>` : ''}
  <div class="pb-copy">
    <h2 class="pb-title">${esc(p.title)}</h2>
    ${p.sub ? `<p class="pb-sub">${esc(p.sub)}</p>` : ''}
    ${p.btn ? `<button class="pb-btn" type="button">${esc(p.btn)}</button>` : ''}
  </div>
  ${withClose ? `<button class="pb-close" type="button" aria-label="Закрыть">×</button>` : ''}
</div>`;
}

function snippet(){
  const b = bannerMarkup(state, true);
  if(state.mode === 'popup'){
    return `<style>${BANNER_CSS}${OVERLAY_CSS}</style>
<div class="pb-overlay" id="pb-overlay">${b}</div>
<script>
(function(){
  var o = document.getElementById('pb-overlay');
  o.addEventListener('click', function(e){
    if(e.target === o || (e.target.closest && e.target.closest('.pb-close'))) o.remove();
  });
})();
<\/script>`;
  }
  return `<style>${BANNER_CSS}</style>\n${b}`;
}

const SITE = `<div class="site" aria-hidden="true">
  <div class="top"><span class="logo"></span><span class="nav"><i></i><i></i><i></i><i></i></span></div>
  <div class="hero"><div class="h1"></div><div class="h2"></div>
    <div class="cards"><div></div><div></div><div></div></div>
  </div>
</div>`;

const stage = document.getElementById('stage');
const restoreBtn = document.getElementById('restore');
const pngOut = document.getElementById('png-out');
const pngImg = document.getElementById('png-img');
const pngStatus = document.getElementById('png-status');

function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, maxW){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(line && ctx.measureText(t).width > maxW){ lines.push(line); line = w; }
    else line = t;
  }
  if(line) lines.push(line);
  return lines;
}

async function renderPNG(){
  await Promise.all([
    document.fonts.load('800 46px Unbounded'),
    document.fonts.load('500 20px Manrope'),
    document.fonts.load('700 20px Manrope')
  ]).catch(() => {});

  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${buildArt(state)}</svg>`;
  const artImg = new Image();
  await new Promise((res, rej) => {
    artImg.onload = res;
    artImg.onerror = rej;
    artImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.drawImage(artImg, 0, 0, W, H);

  const fg = isLight(state.bg) ? '#14141a' : '#ffffff';
  const afg = isLight(state.accent) ? '#14141a' : '#ffffff';
  const m = 39, padX = 33.8, padY = 32.5, boxW = 377, innerW = boxW - 2*padX;
  const titleLH = 46.4, subLH = 28.3, btnH = 48.1;

  // Метка
  if(state.badge){
    ctx.font = '700 15px Manrope, system-ui, sans-serif';
    ctx.letterSpacing = '1.2px';
    const label = state.badge.toUpperCase();
    const tw = ctx.measureText(label).width;
    const bw = tw + 2*18.2, bh = 30.6;
    ctx.fillStyle = state.accent;
    rr(ctx, m, m, bw, bh, bh/2); ctx.fill();
    ctx.fillStyle = afg;
    ctx.fillText(label, m + 18.2, m + 19.5);
    ctx.letterSpacing = '0px';
  }

  // Текстовая панель
  ctx.font = '800 45.5px Unbounded, system-ui, sans-serif';
  const tl = wrapText(ctx, state.title, innerW);
  ctx.font = '500 19.5px Manrope, system-ui, sans-serif';
  const sl = state.sub ? wrapText(ctx, state.sub, innerW) : [];
  ctx.font = '700 19.5px Manrope, system-ui, sans-serif';
  const btnTextW = state.btn ? ctx.measureText(state.btn).width : 0;
  const btnW = btnTextW + 2*28.6;

  let contentH = tl.length * titleLH;
  if(sl.length) contentH += 15.6 + sl.length * subLH;
  if(state.btn) contentH += 15.6 + 5.2 + btnH;
  const panelH = contentH + 2*padY;
  const panelY = H - m - panelH, panelX = m;

  ctx.fillStyle = hexA(state.bg, 0.78);
  rr(ctx, panelX, panelY, boxW, panelH, 24); ctx.fill();

  let cy = panelY + padY;
  const tx = panelX + padX;
  ctx.fillStyle = fg;
  ctx.font = '800 45.5px Unbounded, system-ui, sans-serif';
  tl.forEach((line, i) => ctx.fillText(line, tx, cy + titleLH*0.8 + i*titleLH));
  cy += tl.length * titleLH;

  if(sl.length){
    cy += 15.6;
    ctx.font = '500 19.5px Manrope, system-ui, sans-serif';
    sl.forEach((line, i) => ctx.fillText(line, tx, cy + subLH*0.78 + i*subLH));
    cy += sl.length * subLH;
  }

  if(state.btn){
    cy += 15.6 + 5.2;
    ctx.fillStyle = state.accent;
    rr(ctx, tx, cy, btnW, btnH, btnH/2); ctx.fill();
    ctx.fillStyle = afg;
    ctx.font = '700 19.5px Manrope, system-ui, sans-serif';
    ctx.fillText(state.btn, tx + 28.6, cy + btnH/2 + 7);
  }

  pngImg.src = cv.toDataURL('image/png');
  pngOut.hidden = false;
}

function renderPreview(){
  if(state.mode === 'popup'){
    stage.className = 'stage popup';
    stage.innerHTML = SITE + (state.closed ? '' : `<div class="pb-overlay">${bannerMarkup(state, true)}</div>`);
  } else {
    stage.className = 'stage';
    stage.innerHTML = bannerMarkup(state, true);
  }
  restoreBtn.hidden = !(state.mode === 'popup' && state.closed);
}

function syncControls(){
  document.querySelectorAll('[data-group]').forEach(g => {
    const key = g.dataset.group;
    g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(state[key] === b.dataset.v)));
  });
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if(el.type === 'checkbox') el.checked = !!state[k];
    else if(el.value !== String(state[k])) el.value = state[k];
  });
  document.querySelectorAll('[data-out]').forEach(o => { o.textContent = state[o.dataset.out]; });
}

function render(){
  syncControls();
  renderPreview();
  pngOut.hidden = true;
  pngStatus.textContent = '';
}

document.addEventListener('input', e => {
  const el = e.target;
  if(!el.dataset || !el.dataset.k) return;
  const k = el.dataset.k;
  state[k] = el.type === 'range' ? +el.value : el.value;
  render();
});

document.addEventListener('click', async e => {
  const seg = e.target.closest('[data-group] button');
  if(seg){
    const key = seg.parentElement.dataset.group;
    state[key] = seg.dataset.v;
    if(key === 'mode') state.closed = false;
    render();
    return;
  }
  if(e.target.closest('[data-action="seed"]')){
    state.seed = Math.floor(Math.random() * 1000000);
    render();
    return;
  }
  if(e.target.closest('[data-action="png"]')){
    pngStatus.textContent = 'Готовлю картинку...';
    try{
      await renderPNG();
      pngStatus.textContent = 'Готово, картинка ниже';
    } catch(err){
      pngStatus.textContent = 'Не удалось собрать картинку';
    }
    return;
  }
  if(e.target.closest('.stage .pb-close')){
    state.closed = true;
    render();
    return;
  }
  if(e.target.closest('#restore')){
    state.closed = false;
    render();
  }
});

render();
</script>
